[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-desk"
version = "0.1.0"
description = "Support email triage: classify, route, ground, gate, escalate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Only what the current phase needs. LangGraph, ChromaDB, LangChain and Streamlit
# arrive in later phases; requirements.txt lists the full stack with its phases.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
support-desk = "support_desk.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_desk"]

# ---------------------------------------------------------------------------
# Ruff: linting and formatting. Replaces flake8, isort, pyupgrade and black.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "A",    # flake8-builtins (shadowing)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib over os.path
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and hard-coded fake credentials.
"tests/**/*.py" = ["S101", "S105", "S106", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy: strict. The classifier's contract depends on its types being real.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: end-to-end graph runs; slower than unit tests",
]

[tool.coverage.run]
source = ["src/support_desk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
