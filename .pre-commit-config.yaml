# Quality gates that run before a commit is created.
#
# Install once with:  pre-commit install     (or: make install)
# Refresh versions:   pre-commit autoupdate
# Run over all files: pre-commit run --all-files
#
# These run locally and can be skipped with `git commit --no-verify`, so they are
# fast feedback rather than enforcement. The enforcement is the same set of
# checks running in GitHub Actions, where they cannot be bypassed.
exclude: '^(data/|artifacts/|docs/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      # Blocks committing an SSH or PGP private key.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Lint with autofix first, then format.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # There is deliberately no mypy hook here.
  #
  # pre-commit runs every hook in an isolated environment, so mypy would need its
  # own copy of each typed dependency. That list drifts out of step with
  # pyproject.toml, and the hook then disagrees with `make typecheck` - reporting
  # errors that do not exist locally, or missing ones that do. mypy is also the
  # only hook that needs project dependencies at all; everything else here runs
  # standalone.
  #
  # Type checking therefore has exactly one definition: `make typecheck`, run
  # locally and by the CI "check" job.

  # Catches API keys and tokens before they reach git history, where removing
  # them is not enough: the key was public and must be rotated.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
