# Quality gates that run before a commit is created.
#
# Install once with:  pre-commit install
# Refresh versions:   pre-commit autoupdate
# Run over all files: pre-commit run --all-files
exclude: '^(data/|evals/reports/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      # Blocks committing an SSH or PGP private key.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Lint first (with autofix), then format.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # mypy runs in its own isolated env, so it needs the typed deps too.
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
        args: [--strict, --ignore-missing-imports]

  # Catches API keys and tokens before they reach git history, where removing
  # them is painful and the key must be rotated anyway.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Strips notebook outputs so committed notebooks stay reviewable and never
  # carry cached results or accidentally-printed credentials.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
