name: CI

# Runs on every push to a branch and on every pull request into main.
# Make this check "required" in the repository's branch protection settings and
# the merge button stays disabled until it is green.
on:
  push:
    branches-ignore: []
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run, so you are not waiting
# behind a build you no longer care about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Separate steps rather than one `make check`, so the GitHub UI shows you
      # which stage failed without opening the log.
      #
      # PY= overrides the Makefile's virtualenv prefix: in CI the tools are
      # already on PATH. The commands themselves are the same ones you run
      # locally, so CI cannot disagree with your machine.
      - name: Lint and format
        run: make lint PY=

      - name: Typecheck
        run: make typecheck PY=

      # No secrets are provided to this job on purpose. The unit tests must pass
      # with no network and no API key, which is also what stops a stray test
      # from spending real money.
      - name: Test
        run: make test PY=

  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs everything in .pre-commit-config.yaml, including the secret scan.
      # This is the safety net for the one mistake that cannot be undone by a
      # later commit: a key reaching the history.
      - uses: pre-commit/action@v3.0.1
